# Response headers for AWS Amplify Hosting.
# deploy/aws/site.yaml applies the same security headers for S3 + CloudFront;
# keep the two in sync when changing either.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      # The sha256 allows exactly one inline script: the no-js/js class swap in
      # index.html. Recompute it if that line ever changes.
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-e2g5HkZP+fghbsY1m7moq4GopOo7zRRaAHNyQ2Q7oSI='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
  # Filenames aren't fingerprinted, so caching stays modest: an hour for the
  # site's own CSS/JS, a month for fonts, libraries and images.
  - pattern: '/assets/css/**'
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: '/assets/js/main.js'
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: '/assets/js/vendor/**'
    headers:
      - key: Cache-Control
        value: public, max-age=2592000
  - pattern: '/assets/fonts/**'
    headers:
      - key: Cache-Control
        value: public, max-age=2592000
  - pattern: '/assets/img/**'
    headers:
      - key: Cache-Control
        value: public, max-age=2592000
